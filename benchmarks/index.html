<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Version: 1.1.9 - Instrumented Restoration - Cache Buster: 1772310000 -->
    <title>Lodum Performance Dashboard</title>
    <script>
        // AGGRESSIVE SHIM: Force non-passive listeners globally
        (function() {
            const original = EventTarget.prototype.addEventListener;
            EventTarget.prototype.addEventListener = function(type, listener, options) {
                if (['touchstart', 'touchmove', 'wheel', 'mousewheel'].includes(type)) {
                    if (typeof options === 'object') options.passive = false;
                    else options = { passive: false, capture: !!options };
                }
                return original.call(this, type, listener, options);
            };
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
    <style>
        :root {
            --lodum-yellow: #fbc929;
            --lodum-yellow-dark: #d9a300;
            --text-main: #1f2937;
            --bg-main: #ffffff;
            --bg-muted: #f9fafb;
            --border-color: #e5e7eb;
        }
        body { font-family: Inter, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; line-height: 1.4; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { border-bottom: 2px solid var(--lodum-yellow); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: var(--bg-muted); border-left: 4px solid var(--lodum-yellow); padding: 15px; border-radius: 0 8px 8px 0; }
        .kpi-value { font-size: 1.5rem; font-weight: 800; }
        .kpi-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        .grid-main { display: grid; grid-template-columns: 7fr 5fr; gap: 20px; }
        .heatmap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .heatmap-cell { padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #eee; font-size: 0.8rem; }
        .cell-label { display: block; font-size: 0.6rem; color: #666; margin-bottom: 2px; }
        .cell-value { font-weight: 700; }
        .cell-good { background: #ecfdf5; color: #065f46; }
        .cell-bad { background: #fef2f2; color: #991b1b; }
        .cell-warn { background: #fffbeb; color: #92400e; }
        .apexcharts-tooltip, .custom-tooltip { pointer-events: none !important; user-select: none !important; }
        .custom-tooltip { background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-width: 300px; }
        #status-bar { position: fixed; bottom: 10px; right: 10px; background: #000; color: #0f0; padding: 5px 10px; font-size: 10px; z-index: 9999; border-radius: 4px; border: 1px solid #0a0; }
        .chart-container { touch-action: none !important; }
    </style>
</head>
<body>
    <div id="status-bar">Dashboard Initializing...</div>
    <div class="container">
        <header>
            <h1>Lodum Performance Index</h1>
            <div style="text-align: right;"><span id="last-updated" style="font-size: 0.7rem; color: #666;"></span></div>
        </header>
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-label">Speedup vs MM</div><div class="kpi-value" id="kpi-speedup">--</div></div>
            <div class="kpi-card"><div class="kpi-label">Mem. Reduction</div><div class="kpi-value" id="kpi-memory">--</div></div>
            <div class="kpi-card"><div class="kpi-label">WASM Efficiency</div><div class="kpi-value" id="kpi-wasm">--</div></div>
            <div class="kpi-card"><div class="kpi-label">Throughput</div><div class="kpi-value" id="kpi-throughput">--</div></div>
        </div>

        <div class="grid-main">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <b>Serialization Latency (JSON)</b>
                    <select id="scenario-selector"><option value="simple">Simple</option><option value="complex">Complex</option><option value="nested">Nested</option></select>
                </div>
                <div id="main-chart" class="chart-container"></div>
                <div id="brush-chart" class="chart-container"></div>
            </div>
            <div>
                <div class="card"><b>Evolution Path</b><div id="frontier-chart" class="chart-container"></div></div>
                <div class="card"><b>Regression vs v0.3.0</b><div class="heatmap-grid" id="regression-heatmap"></div><div id="hover-details" style="font-size: 0.75rem; margin-top: 15px; border-top: 1px dashed #eee; padding-top: 10px;">Hover a point to explore.</div></div>
            </div>
        </div>
        <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="card"><b>Binary Formats (Latest)</b><div id="format-chart" class="chart-container"></div></div>
            <div class="card" style="background: var(--bg-muted);"><b>Glossary</b><div style="font-size: 0.8rem; margin-top: 10px;"><b>Latency</b>: us/op. <b>RAM</b>: Peak MB. <b>Streaming</b>: O(1) mode.</div></div>
        </div>
    </div>

    <script src="./data.js"></script>
    <script>
        const Debug = {
            log: (cat, msg, data) => {
                const ts = new Date().toISOString().split('T')[1].substring(0,8);
                console.log(`[%c${cat}%c][${ts}] ${msg}`, 'color: #fbc929; font-weight: bold', '', data || '');
            },
            error: (msg, err) => console.error(`[ERROR] ${msg}`, err)
        };

        const Sync = {
            selectedSha: null,
            hoverSha: null,
            history: [],
            commitMap: new Map(),
            frontierPoints: [],
            baselineSha: null,
            releaseAnnotations: [],
            
            init: () => {
                Debug.log('DATA', 'Initializing dataset...');
                const data = window.BENCHMARK_DATA;
                if (!data) { Debug.error('BENCHMARK_DATA not found'); return; }
                
                Sync.history = data.history || [];
                Debug.log('DATA', `Milestones in history: ${Sync.history.length}`);
                
                Object.entries(data.entries).forEach(([suite, points]) => {
                    points.forEach(p => {
                        const id = p.commit.id;
                        if (!id || !Sync.history.includes(id)) return;
                        if (!Sync.commitMap.has(id)) Sync.commitMap.set(id, { id, short: id.substring(0,7), msg: p.commit.message, data: {} });
                        const c = Sync.commitMap.get(id);
                        if (!c.data[suite] || (p.benches && p.benches.length > (c.data[suite].benches || []).length)) c.data[suite] = p;
                    });
                });
                
                const tags = data.tags || {};
                Sync.releaseAnnotations = Object.entries(tags).map(([sha, label]) => {
                    const idx = Sync.history.indexOf(sha);
                    if (idx === -1) return null;
                    if (label === 'v0.3.0') Sync.baselineSha = sha;
                    return { x: idx, borderColor: '#fbc929', strokeDashArray: 0, label: { text: label, style: { color: '#fff', background: '#fbc929' } } };
                }).filter(a => a !== null);
                
                if (!Sync.baselineSha) Sync.baselineSha = Sync.history[0];
                Sync.selectedSha = Sync.history[Sync.history.length - 1];
                
                Debug.log('DATA', `Mapped ${Sync.commitMap.size} commits with actual data.`);
                Debug.log('DATA', `Baseline SHA: ${Sync.baselineSha.substring(0,7)}`);
            },
            
            getVal: (sha, pid, bench) => {
                const c = Sync.commitMap.get(sha); if (!c) return null;
                const suiteKey = Object.keys(c.data).find(k => k.toLowerCase().includes(pid.toLowerCase()));
                if (!suiteKey) return null;
                const benchObj = c.data[suiteKey].benches.find(x => x.name.toLowerCase().includes(bench.toLowerCase()));
                return benchObj ? benchObj.value : null;
            },
            
            update: (sha, source) => {
                if (!sha) return;
                Sync.hoverSha = sha;
                document.getElementById('status-bar').innerText = `Event [${source}]: ${sha.substring(0,7)}`;
                
                // Annotate other charts
                try {
                    // Trend Chart Highlighting
                    const hIdx = Sync.history.indexOf(sha);
                    if (source !== 'trend' && hIdx !== -1) {
                        ApexCharts.exec('trend', 'removeAnnotation', 'sync-link');
                        ApexCharts.exec('trend', 'addXaxisAnnotation', { 
                            id: 'sync-link', x: hIdx, borderColor: '#ef4444', 
                            label: { text: 'Linked', style: { color: '#fff', background: '#ef4444' } } 
                        });
                    }
                    
                    // Frontier Chart Highlighting
                    const fp = Sync.frontierPoints.find(p => p.sha === sha);
                    if (source !== 'frontier' && fp) {
                        ApexCharts.exec('frontier', 'removeAnnotation', 'sync-link');
                        ApexCharts.exec('frontier', 'addPointAnnotation', { 
                            id: 'sync-link', x: fp.x, y: fp.y, marker: { size: 10, fillColor: '#ef4444', strokeWidth: 0 } 
                        });
                    }
                } catch (e) { Debug.error('Annotation update failed', e); }
                
                Sync.updateHeatmap(sha);
            },
            
            clear: () => {
                Sync.hoverSha = null;
                try {
                    ApexCharts.exec('trend', 'removeAnnotation', 'sync-link');
                    ApexCharts.exec('frontier', 'removeAnnotation', 'sync-link');
                } catch (e) {}
                Sync.updateHeatmap(Sync.selectedSha);
            },
            
            updateHeatmap: (sha) => {
                const c = Sync.commitMap.get(sha);
                if (!c) return;
                const grid = document.getElementById('regression-heatmap');
                if (!grid) return;
                
                grid.innerHTML = '';
                document.getElementById('hover-details').innerHTML = `<b>${c.short}</b>: ${c.msg}`;
                
                const platforms = {'ubuntu-latest':'Linux', 'windows-latest':'Windows', 'Pyodide':'WASM'};
                ['simple', 'complex', 'nested'].forEach(s => {
                    Object.entries(platforms).forEach(([pid, label]) => {
                        const cur = Sync.getVal(sha, pid, `JSON Serialization Lodum ${s}`);
                        const base = Sync.getVal(Sync.baselineSha, pid, `JSON Serialization Lodum ${s}`);
                        let delta = 0, cls = 'cell-neutral';
                        if (cur && base) {
                            delta = ((cur / base) - 1) * 100;
                            cls = delta < -5 ? 'cell-good' : (delta > 15 ? 'cell-bad' : (delta > 5 ? 'cell-warn' : 'cell-neutral'));
                        }
                        const cell = document.createElement('div');
                        cell.className = `heatmap-cell ${cls}`;
                        cell.innerHTML = `<span class="cell-label">${label} / ${s}</span><span class="cell-value">${cur ? (delta>0?'+':'') + delta.toFixed(0) + '%' : 'N/A'}</span>`;
                        grid.appendChild(cell);
                    });
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            Sync.init();
            
            // Build Frontier Data
            Sync.frontierPoints = Sync.history.map(sha => {
                const t = Sync.getVal(sha, 'ubuntu-latest', 'Streaming (load_stream) Time') || Sync.getVal(sha, 'ubuntu-latest', 'Standard (loads) Time');
                const m = Sync.getVal(sha, 'ubuntu-latest', 'Streaming (load_stream) Memory') || Sync.getVal(sha, 'ubuntu-latest', 'Standard (loads) Memory');
                const c = Sync.commitMap.get(sha);
                return (t && m && c) ? { x: t, y: m, sha: sha, short: c.short } : null;
            }).filter(p => p !== null);

            // Frontier Chart
            new ApexCharts(document.querySelector("#frontier-chart"), {
                series: [{ name: 'Evolution', data: Sync.frontierPoints.map(p => ({ x: p.x, y: p.y, sha: p.sha })) }],
                chart: { id: 'frontier', type: 'line', height: 250, toolbar: { show: false }, zoom: { enabled: false },
                    events: {
                        dataPointMouseEnter: (e, ctx, cfg) => {
                            const pt = cfg.w.config.series[0].data[cfg.dataPointIndex];
                            if (pt) Sync.update(pt.sha, 'frontier');
                        },
                        dataPointMouseLeave: () => Sync.clear(),
                        click: (e, ctx, cfg) => {
                            const pt = cfg.w.config.series[0].data[cfg.dataPointIndex];
                            if (pt) { Sync.selectedSha = pt.sha; Sync.update(pt.sha, 'select'); }
                        }
                    }
                },
                xaxis: { type: 'numeric', labels: { formatter: v => v ? v.toFixed(2)+'s' : '' } },
                markers: { size: 6, hover: { size: 10 }, colors: Sync.frontierPoints.map((p, i) => i === Sync.frontierPoints.length - 1 ? '#ef4444' : '#cbd5e1') },
                tooltip: { custom: ({ series, seriesIndex, dataPointIndex, w }) => {
                    const p = Sync.frontierPoints[dataPointIndex];
                    return `<div class="custom-tooltip"><b>${p.short}</b><br/>${p.x.toFixed(3)}s / ${p.y.toFixed(1)}MB</div>`;
                }}
            }).render();

            let mainChart, brushChart;
            const updateTrend = (scenario) => {
                Debug.log('UI', `Switching scenario: ${scenario}`);
                const series = ['ubuntu-latest', 'windows-latest', 'Pyodide'].map(pid => ({
                    name: pid.includes('ubuntu') ? 'Linux' : (pid.includes('win') ? 'Windows' : 'WASM'),
                    color: pid.includes('ubuntu') ? '#fbc929' : (pid.includes('win') ? '#3b82f6' : '#10b981'),
                    data: Sync.history.map((sha, idx) => ({ x: idx, y: Sync.getVal(sha, pid, `JSON Serialization Lodum ${scenario}`), sha: sha }))
                }));

                if (mainChart) mainChart.destroy();
                if (brushChart) brushChart.destroy();

                mainChart = new ApexCharts(document.querySelector("#main-chart"), {
                    series: series,
                    chart: { id: 'trend', type: 'line', height: 280, toolbar: { show: false }, animations: { enabled: false },
                        events: {
                            dataPointMouseEnter: (e, ctx, cfg) => {
                                const pt = cfg.w.config.series[cfg.seriesIndex].data[cfg.dataPointIndex];
                                if (pt) Sync.update(pt.sha, 'trend');
                            },
                            dataPointMouseLeave: () => Sync.clear(),
                            click: (e, ctx, config) => {
                                const x = ctx.w.globals.lastIndices.x[0];
                                if (x !== undefined) { const sha = Sync.history[Math.round(x)]; if (sha) { Sync.selectedSha = sha; Sync.update(sha, 'select'); } }
                            }
                        }
                    },
                    annotations: { xaxis: Sync.releaseAnnotations },
                    xaxis: { type: 'numeric', min: 0, max: Sync.history.length - 1, labels: { formatter: v => Sync.history[Math.round(v)]?.substring(0,7) || '' } },
                    markers: { size: 5, hover: { size: 10 }, strokeWidth: 0 },
                    tooltip: { shared: true, custom: ({ series, seriesIndex, dataPointIndex, w }) => {
                        const sha = Sync.history[dataPointIndex];
                        const c = Sync.commitMap.get(sha);
                        if (!c) return '';
                        let html = `<div class="custom-tooltip"><b>${c.short}</b><br/>${(c.msg || "").substring(0,100)}<hr/>`;
                        w.config.series.forEach((s, i) => {
                            const p = s.data[dataPointIndex];
                            if (p && p.y != null) html += `<div><span style="color:${s.color}">●</span> ${s.name}: <b>${p.y.toFixed(2)}µs</b></div>`;
                        });
                        return html + '</div>';
                    }}
                });
                mainChart.render();

                brushChart = new ApexCharts(document.querySelector("#brush-chart"), {
                    series: series,
                    chart: { id: 'brush', height: 80, type: 'area', brush: { target: 'trend', enabled: true }, selection: { enabled: true, xaxis: { min: Math.max(0, Sync.history.length - 8), max: Sync.history.length - 1 } } },
                    colors: series.map(s => s.color), fill: { opacity: 0.2 },
                    xaxis: { type: 'numeric', labels: { show: false } }, yaxis: { labels: { show: false } }
                });
                brushChart.render();
            };

            // Update Metrics (KPIs)
            try {
                const latestSha = Sync.history[Sync.history.length - 1];
                const lodumSimple = Sync.getVal(latestSha, 'ubuntu-latest', 'JSON Serialization Lodum simple');
                const marshmallowSimple = Sync.getVal(latestSha, 'ubuntu-latest', 'JSON Serialization Marshmallow simple');
                if (lodumSimple && marshmallowSimple) document.getElementById('kpi-speedup').innerText = (marshmallowSimple / lodumSimple).toFixed(1) + 'x';
                
                const stdMem = Sync.getVal(latestSha, 'ubuntu-latest', 'Standard (loads) Memory');
                const strmMem = Sync.getVal(latestSha, 'ubuntu-latest', 'Streaming (load_stream) Memory');
                if (stdMem && strmMem) document.getElementById('kpi-memory').innerText = ((1 - (strmMem / stdMem)) * 100).toFixed(1) + '%';
                
                const wasmVal = Sync.getVal(latestSha, 'Pyodide', 'JSON Serialization Lodum simple');
                if (lodumSimple && wasmVal) document.getElementById('kpi-wasm').innerText = ((lodumSimple / wasmVal) * 100).toFixed(0) + '%';
                
                const strmTime = Sync.getVal(latestSha, 'ubuntu-latest', 'Streaming (load_stream) Time');
                if (strmTime) document.getElementById('kpi-throughput').innerText = (45 / strmTime).toFixed(1) + ' MB/s';
            } catch (e) { Debug.error('KPI calculation failed', e); }

            updateTrend('simple');
            document.getElementById('scenario-selector').onchange = (e) => updateTrend(e.target.value);

            // Binary Formats
            const latestSha = Sync.history[Sync.history.length - 1];
            const formats = [{n:'JSON', p:'JSON Serialization Lodum complex'}, {n:'MsgPack', p:'MsgPack Serialization Lodum complex'}, {n:'CBOR', p:'CBOR Serialization Lodum complex'}, {n:'Pickle', p:'Pickle Serialization Lodum (Safe) complex'}];
            new ApexCharts(document.querySelector("#format-chart"), {
                series: [{ data: formats.map(f => Sync.getVal(latestSha, 'ubuntu-latest', f.p) || 0) }],
                chart: { type: 'bar', height: 180, toolbar: { show: false } },
                plotOptions: { bar: { horizontal: true, distributed: true } },
                colors: ['#94a3b8', '#fbc929', '#3b82f6', '#10b981'],
                xaxis: { categories: formats.map(f => f.n) }, legend: { show: false }
            }).render();

            Sync.update(Sync.selectedSha, 'init');
            if (window.BENCHMARK_DATA.lastUpdate) document.getElementById('last-updated').textContent = 'Sync: ' + new Date(window.BENCHMARK_DATA.lastUpdate).toLocaleString();
            UI.status('Ready');
        });
    </script>
</body>
</html>
