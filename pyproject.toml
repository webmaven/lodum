[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lodum"
version = "0.0.1"
description = "A Python serialization/deserialization library (AKA LOad/DUMp) inspired by Rust's serde."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Michael R. Bernstein", email = "zopemaven@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ruamel.yaml>=0.18.0",
    "numpy>=1.23.5",
    "pandas>=1.5.3",
    "polars>=0.16.0",
]

[project.urls]
"Homepage" = "https://github.com/webmaven/lodum"
"Bug Tracker" = "https://github.com/webmaven/lodum/issues"

[tool.hatch.envs.default]
dependencies = [
  "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest"
