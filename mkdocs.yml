site_name: lodum
site_url: https://webmaven.github.io/lodum/
site_description: High-performance Python serialization (AKA serde for Python).

theme:
  name: material
  logo: assets/dumptruck-icon.png
  favicon: assets/dumptruck-icon.png
  palette:
    # Primary: Construction Yellow (#fbc929)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark: Industrial Gray (#505256)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.view
    - content.action.edit
    - content.tooltips
    - content.revision.date
    - content.revision.history

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
  # Enable last updated date in footer
  last_updated: true

repo_url: https://github.com/webmaven/lodum
repo_name: webmaven/lodum

nav:
  - Home: index.md
  - Changelog: NEWS.md
  - User Guide:
    - Getting Started: GETTING_STARTED.md
    - Interactive Demo: demo.md
    - Field Customization: FIELD_CUSTOMIZATION.md
    - Validation: VALIDATION.md
    - Streaming: STREAMING.md
    - Performance:
      - Overview: PERFORMANCE.md
      - Performance Evolution: PERFORMANCE_EVOLUTION.md
      - Benchmark Methodology: BENCHMARK_METHODOLOGY.md
      - Benchmark History: BENCHMARK_HISTORY.md
    - Migration: MIGRATION.md
  - API Reference: api_reference.md
  - Technical Specs:
    - Architecture: ARCHITECTURE.md
    - Implementing Formats: IMPLEMENTING_FORMATS.md
  - Project:
    - Roadmap & Plans:
      - Roadmap: ROADMAP.md
      - Streaming Support: plans/streaming_support.md
      - Partial Serialization: plans/partial_serialization.md
      - FastAPI Integration: plans/fastapi_integration.md
      - OpenAPI Support: plans/openapi_support.md
      - Schema-to-Code: plans/schema_to_code_cli_tool.md
      - Compiler Enhancements: plans/compiler_enhancements_cython_mypyc.md
      - Protocol Buffers: plans/protocol_buffers_support.md
      - IDE Plugin: plans/ide_plugin.md
    - Security: SECURITY.md
    - Contributing: CONTRIBUTING.md

plugins:
  - git-revision-date-localized:
      type: datetime
      enable_creation_date: true
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

