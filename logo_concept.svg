<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Concept: The Hex Container - Pythonic, Modular, Secure -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776ab;stop-opacity:1" /> <!-- Python Blue -->
      <stop offset="100%" style="stop-color:#ffd343;stop-opacity:1" /> <!-- Python Yellow -->
    </linearGradient>
  </defs>
  
  <!-- Outer Hexagon -->
  <path d="M100 10 L186.6 60 V160 L100 210 L13.4 160 V60 Z" stroke="url(#grad1)" stroke-width="10" fill="#1e1e1e" />
  
  <!-- Inner Data Cubes -->
  <rect x="65" y="65" width="30" height="30" rx="5" fill="#3776ab" />
  <rect x="105" y="65" width="30" height="30" rx="5" fill="#ffd343" />
  <rect x="65" y="105" width="30" height="30" rx="5" fill="#ffd343" />
  <rect x="105" y="105" width="30" height="30" rx="5" fill="#3776ab" />
  
  <!-- Serialization Arrows (In/Out) -->
  <path d="M40 100 L10 100 M10 100 L25 85 M10 100 L25 115" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M160 100 L190 100 M190 100 L175 85 M190 100 L175 115" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Text Label (Optional) -->
  <!-- <text x="100" y="180" font-family="monospace" font-size="24" fill="white" text-anchor="middle">lodum</text> -->
</svg>
