name: Docs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install mkdocs-material "mkdocstrings[python]" mike mkdocs-git-revision-date-localized-plugin
          
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true

      - name: Build and Deploy
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract version from tag (e.g., v0.4.0 -> 0.4.0)
            VERSION=${GITHUB_REF#refs/tags/v}
            PYTHONPATH=src mike deploy --push --update-aliases "$VERSION" latest
            PYTHONPATH=src mike set-default --push latest
          else
            # Deploy current main as 'dev'
            PYTHONPATH=src mike deploy --push --update-aliases dev
          fi
