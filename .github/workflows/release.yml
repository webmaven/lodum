name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-hardware:
    name: Validate Benchmark Hardware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check Hardware Consistency
        run: |
          python benchmarks/get_hw_info.py --check --strict

  pypi-publish:
    name: Upload release to PyPI
    needs: validate-hardware
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lodum
    permissions:
      id-token: write  # Mandatory for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build tool
        run: python -m pip install build
      - name: Build package
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1

  docs-publish:
    name: Deploy versioned documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install mkdocs-material "mkdocstrings[python]" mike mkdocs-git-revision-date-localized-plugin
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true
      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Build and Deploy
        run: |
          # Deploy the tag as a version and update 'latest' alias
          PYTHONPATH=src mike deploy --push --update-aliases ${{ steps.get_version.outputs.VERSION }} latest
          mike set-default --push latest
