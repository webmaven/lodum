name: Benchmarks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        pip install pydantic ijson
    - name: Run Standard Benchmarks
      run: |
        PYTHONPATH=src python benchmarks/run.py > benchmarks/results/latest_native.md
    - name: Run Streaming Benchmark (Markdown)
      run: |
        PYTHONPATH=src python benchmarks/streaming.py 500000 >> benchmarks/results/latest_native.md
    - name: Run Streaming Benchmark (JSON)
      run: |
        PYTHONPATH=src python benchmarks/streaming.py 500000 --json > benchmark_data.json
    - name: Display Markdown Results
      run: cat benchmarks/results/latest_native.md
    - name: Store Benchmark Results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Lodum Performance Index
        tool: 'customGeneric'
        output-file-path: benchmark_data.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # Show alert if performance regresses by 20%
        alert-threshold: '120%'
        comment-on-alert: true
        fail-on-alert: false
