name: Benchmarks

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_historical:
        description: 'Run historical benchmarks (provide space-separated SHAs/tags)'
        type: string
        default: ''
      init_hardware:
        description: 'Initialize/Update hardware signature for current runner'
        type: boolean
        default: false

# concurrency:
#   group: gh-pages-${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Performance Tracking (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        pip install pydantic ijson marshmallow orjson pyinstrument
    - name: Record and Validate Hardware
      run: |
        if [ "${{ github.event.inputs.init_hardware }}" == "true" ]; then
          python benchmarks/get_hw_info.py --init
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p benchmarks/metadata
          git add benchmarks/metadata/*.json
          git commit -m "chore: update hardware signature for ${{ matrix.os }}" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
        else
          python benchmarks/get_hw_info.py --check
        fi
      shell: bash
    - name: Run Standard Benchmarks
      run: |
        python benchmarks/run.py --json --use-baselines --profile --profile-output=profiles --check-regressions --verbose > std_results.json
      shell: bash
      env:
        PYTHONPATH: ${{ matrix.os == 'windows-latest' && 'src;.' || 'src:.' }}
    - name: Run Streaming Benchmark
      run: |
        python benchmarks/streaming.py 500000 --json > stream_results.json
      shell: bash
      env:
        PYTHONPATH: ${{ matrix.os == 'windows-latest' && 'src;.' || 'src:.' }}
    - name: Upload Profiles
      uses: actions/upload-artifact@v4
      with:
        name: profiles-${{ matrix.os }}
        path: profiles/*.prof
    - name: Aggregate and Upload
      shell: python
      run: |
        import json, os
        with open('std_results.json') as f:
            std = json.load(f)
        with open('stream_results.json') as f:
            stream = json.load(f)
        merged = {
            "commit": std.get("commit"),
            "results": std.get("results", []) + stream.get("results", [])
        }
        with open('final_results.json', 'w') as f:
            json.dump(merged, f)
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: results-benchmark-${{ matrix.os }}
        path: final_results.json

  benchmark-pyodide:
    name: Performance Tracking (Pyodide/WASM)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        npm install pyodide
    - name: Build Wheel
      run: python -m build
    - name: Run Pyodide Benchmarks
      run: |
        node run_pyodide_node.js --benchmark --output=pyodide_bench.json
    - name: Aggregate Results
      shell: python
      run: |
        import json, os, subprocess
        if not os.path.exists('pyodide_bench.json'):
            print("Pyodide benchmarks failed to produce output.")
            json_data = {"results": []}
        else:
            with open('pyodide_bench.json') as f:
                raw_results = json.load(f)
            
            # Use current HEAD for standard runs
            sha = subprocess.check_output("git rev-parse HEAD", shell=True, text=True).strip()
            msg = subprocess.check_output("git log -1 --format=%s", shell=True, text=True).strip()
            author_name = subprocess.check_output("git log -1 --format=%an", shell=True, text=True).strip()
            author_email = subprocess.check_output("git log -1 --format=%ae", shell=True, text=True).strip()
            timestamp = subprocess.check_output("git log -1 --format=%cI", shell=True, text=True).strip()
            
            results = raw_results.get('results', raw_results) if isinstance(raw_results, dict) else raw_results

            json_data = {
                "commit": {
                    "id": sha,
                    "message": msg,
                    "timestamp": timestamp,
                    "author": {"name": author_name, "email": author_email},
                    "url": f"https://github.com/webmaven/lodum/commit/{sha}"
                },
                "results": results
            }
        
        with open('final_results.json', 'w') as f:
            json.dump(json_data, f)
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: results-benchmark-Pyodide
        path: final_results.json

  finalize-deployment:
    name: Finalize and Deploy Dashboard
    needs: [benchmark, benchmark-pyodide, historical]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Download all results
      uses: actions/download-artifact@v4
      with:
        path: all-results
    - name: Prepare gh-pages Workspace
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-repo
    - name: Merge all results into data.js
      run: |
        python benchmarks/merge_data.py gh-pages-repo all-results
    - name: Validate Dashboard and Data
      run: |
        # Run validation on the merged result
        cp gh-pages-repo/benchmarks/data.js benchmarks/data.js
        python benchmarks/validate_dashboard.py
    - name: Update Template and Push
      run: |
        cd gh-pages-repo
        
        # Ensure benchmarks directory exists
        mkdir -p benchmarks
        
        # Initialize data.js if missing
        if [ ! -f benchmarks/data.js ]; then
          echo "window.BENCHMARK_DATA = { \"entries\": {}, \"history\": [], \"tags\": {} };" > benchmarks/data.js
        fi
        
        cp ../benchmarks/index.html benchmarks/index.html
        
        # Add files only if they exist
        [ -f benchmarks/index.html ] && git add benchmarks/index.html
        [ -f benchmarks/data.js ] && git add benchmarks/data.js
        
        git commit -m "docs: sync dashboard template and data" || echo "No changes"
        
        # Retry loop for push to handle concurrent updates
        for i in {1..5}; do
          git pull --rebase origin gh-pages
          git push origin gh-pages && break || sleep $[RANDOM % 10 + 1]
        done
      shell: bash

  parse_refs:
    name: Parse Historical Refs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # Concurrent Baseline: Always re-run v0.3.0 on push to normalize environment noise
            REFS='["v0.3.0"]'
          else
            REFS=$(echo "${{ github.event.inputs.run_historical }}" | tr ' ' '\n' | jq -R . | jq -s -c .)
          fi
          echo "matrix=$REFS" >> $GITHUB_OUTPUT

  historical:
    name: Historical Baseline (${{ matrix.version }} on ${{ matrix.platform }})
    needs: parse_refs
    if: needs.parse_refs.outputs.matrix != '[""]'
    runs-on: ${{ matrix.platform == 'Pyodide' && 'ubuntu-latest' || matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.parse_refs.outputs.matrix) }}
        platform: ['ubuntu-latest', 'windows-latest', 'Pyodide']
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Fetch and Checkout target version
      run: |
        git fetch origin
        git checkout ${{ matrix.version }}
    - name: Verify Version Loadable
      run: |
        export PYTHONPATH=$PWD/src
        python -c "import lodum; print(f'Successfully loaded lodum version from {lodum.__file__}')" || echo "Warning: Version not cleanly loadable, attempting benchmark anyway."
    - name: Checkout Benchmark Scripts (Current Tooling)
      uses: actions/checkout@v4
      with:
        path: lodum-current
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Set up Node.js (Pyodide)
      if: matrix.platform == 'Pyodide'
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        if [ "${{ matrix.platform }}" == "Pyodide" ]; then
          npm install pyodide
        else
          pip install -e ".[all]"
          pip install pydantic ijson marshmallow orjson ruamel.yaml tomli-w cbor2
        fi
    - name: Build Wheel (Pyodide)
      if: matrix.platform == 'Pyodide'
      run: python -m build
    - name: Run Standard Benchmarks
      if: matrix.platform != 'Pyodide'
      run: |
        python lodum-current/benchmarks/run.py --json --use-baselines --sha=${{ matrix.version }} --verbose > standard_bench.json
        # Run without redirection first to see errors in logs, then redirect
        python lodum-current/benchmarks/streaming.py 100000 --json --sha=${{ matrix.version }} | tee streaming_bench.json
      env:
        PYTHONPATH: ${{ format('{0}/src:{0}/lodum-current', github.workspace) }}
    - name: Run Pyodide Benchmarks
      if: matrix.platform == 'Pyodide'
      run: |
        node lodum-current/run_pyodide_node.js --benchmark --output=standard_bench.json
    - name: Aggregate and Upload
      shell: python
      run: |
        import json, os, subprocess
        with open('standard_bench.json') as f:
            std = json.load(f)
        
        # Merge streaming results if they exist
        if os.path.exists('streaming_bench.json'):
            with open('streaming_bench.json') as f:
                stream = json.load(f)
            results = std.get("results", []) + stream.get("results", [])
        else:
            results = std.get("results", [])
        
        # Resolve ORIGINAL commit metadata
        sha = subprocess.check_output("git rev-parse HEAD", shell=True, text=True).strip()
        msg = subprocess.check_output("git log -1 --format=%s", shell=True, text=True).strip()
        author_name = subprocess.check_output("git log -1 --format=%an", shell=True, text=True).strip()
        author_email = subprocess.check_output("git log -1 --format=%ae", shell=True, text=True).strip()
        timestamp = subprocess.check_output("git log -1 --format=%cI", shell=True, text=True).strip()
        
        json_data = {
            "commit": {
                "id": sha,
                "message": msg,
                "timestamp": timestamp,
                "author": {"name": author_name, "email": author_email},
                "url": f"https://github.com/webmaven/lodum/commit/{sha}"
            },
            "results": results
        }
            
        with open('final_results.json', 'w') as f:
            json.dump(json_data, f)
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: results-historical-${{ matrix.version }}-${{ matrix.platform }}
        path: final_results.json
